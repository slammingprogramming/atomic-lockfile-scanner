name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax check
        run: |
          bash -n atomic-arch-check.sh
          bash -n tests/run-tests.sh
      # SC2010 (ls | grep) is excluded on purpose: it is the only warning, in the optional
      # "pkgfile" line of the build-date report. Pacman cache names cannot contain newlines,
      # so the case it guards against cannot occur. See CHANGES.md, "Left unchanged".
      - name: ShellCheck
        run: shellcheck --severity=warning --exclude=SC2010 atomic-arch-check.sh tests/run-tests.sh
      - name: Tests
        run: bash tests/run-tests.sh

  # Same tests on an Arch Linux userland (coreutils, grep, sed, gawk, findutils as shipped by Arch).
  # It passed on its first run (as root, in a container), so it is required. It is not a real
  # Arch system: pacman state, bpftool, and eBPF are still stubbed.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed bash coreutils grep sed gawk findutils git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests
        run: bash tests/run-tests.sh
